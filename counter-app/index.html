<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Counter 1</h1>

    <div class="counter-display">
      <span class="count" id="count">0000</span>
      <span class="increment-indicator">+1</span>
    </div>

    <button class="reset-btn" id="reset-btn" aria-label="Reset counter">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
        <path d="M3 12a9 9 0 1 1 9 9" stroke-linecap="round"/>
        <path d="M3 7v5h5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="controls">
      <button class="btn" id="decrement-btn" aria-label="Decrement">
        <svg viewBox="0 0 24 24" fill="none">
          <line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="btn" id="increment-btn" aria-label="Increment">
        <svg viewBox="0 0 24 24" fill="none">
          <line x1="12" y1="5" x2="12" y2="19" stroke-linecap="round"/>
          <line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Do you want to reset the counter</h2>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="popup-cancel">Cancel</button>
                <button class="btn btn-primary" id="popup-proceed">Yes</button>
            </div>
        </div>
  </div>





  <script src="app.js"></script>
</body>
</html>
